<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wiki-ask</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <section class="wiki-source">
        <div class="wiki-source-label">WIKI 來源</div>
        <div class="wiki-source-row">
          <span class="wiki-path" id="wiki-path">讀取中…</span>
          <button type="button" class="link-button" id="wiki-change">變更</button>
        </div>
        <form class="wiki-form" id="wiki-form" hidden>
          <input type="text" id="wiki-input" placeholder="貼上或輸入 WIKI 資料夾路徑" autocomplete="off" spellcheck="false">
          <div class="wiki-form-actions">
            <button type="button" id="wiki-browse">瀏覽…</button>
            <button type="submit" class="primary">儲存</button>
            <button type="button" id="wiki-cancel">取消</button>
          </div>
          <div class="form-error" id="wiki-error" hidden></div>
        </form>
      </section>
      <button type="button" class="new-chat" id="new-chat">＋ 新對話</button>
      <input type="search" class="conversation-search" id="conversation-search" placeholder="搜尋對話內容" aria-label="搜尋對話內容" autocomplete="off" spellcheck="false">
      <nav class="conversation-list" id="conversation-list" aria-label="對話清單"></nav>
      <div class="sidebar-note">對話紀錄保留兩週</div>
    </aside>

    <main class="chat">
      <form class="token-bar" id="token-bar" hidden>
        <label for="token-input">請貼上 token（在 <code>%USERPROFILE%\.wikichat\token</code>）</label>
        <div class="token-row">
          <input type="password" id="token-input" autocomplete="off" spellcheck="false">
          <button type="submit" class="primary">儲存</button>
        </div>
      </form>
      <div class="banner" id="banner" hidden></div>
      <div class="messages" id="messages"></div>
      <div class="role-bar" id="role-bar"></div>
      <form class="composer" id="composer">
        <textarea id="question" rows="3" placeholder="問 WIKI 一個問題（Enter 送出，Shift+Enter 換行）"></textarea>
        <div class="composer-actions">
          <button type="button" id="stop" hidden>停止</button>
          <button type="submit" class="primary" id="send">送出</button>
        </div>
      </form>
    </main>

    <aside class="preview" id="preview" hidden>
      <div class="preview-resizer" id="preview-resizer" role="separator" aria-orientation="vertical" aria-label="拖曳調整預覽寬度（雙擊還原）" title="拖曳調整寬度，雙擊還原"></div>
      <header class="preview-header">
        <button type="button" class="icon-button" id="preview-back" aria-label="上一頁" title="上一頁" hidden>←</button>
        <span class="preview-title" id="preview-title"></span>
        <button type="button" class="icon-button" id="preview-close" aria-label="關閉預覽">✕</button>
      </header>
      <div class="preview-body markdown" id="preview-body"></div>
    </aside>
  </div>
</body>
</html>
